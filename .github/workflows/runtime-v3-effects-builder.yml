name: Runtime V3 effects and recovery builder

on:
  pull_request:
    branches:
      - agent/runtime-v3-foundation
    paths:
      - scripts/runtime_v3_effects_patch.py
      - scripts/runtime_v3_background_patch.py
      - scripts/runtime_v3_bg_notice_fix.py
      - .github/workflows/runtime-v3-effects-builder.yml
      - src/agent/runtime_v3/**
      - src/bg_monitor.py
      - tests/runtime_v3/**

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-v3-effects-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply durable executor integration
        run: python scripts/runtime_v3_effects_patch.py

      - name: Apply background serialization integration
        run: python scripts/runtime_v3_background_patch.py

      - name: Repair background notice protocol
        run: python scripts/runtime_v3_bg_notice_fix.py

      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            src/agent/runtime_v3 \
            src/agent/runtime_v2/executor.py \
            src/agent_runs.py \
            src/bg_monitor.py \
            tests/runtime_v3

      - name: Run Runtime V3 fault-oriented tests
        run: python -m unittest discover -s tests/runtime_v3 -v

      - name: Validate diff
        run: git diff --check

      - name: Commit verified integration
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add \
            src/agent/runtime_v2/executor.py \
            src/agent/runtime_v3/ledger.py \
            src/agent_runs.py \
            src/bg_monitor.py
          git commit -m "feat(agent): integrate durable effects and recovery"
          git push origin HEAD:"${HEAD_REF}"
