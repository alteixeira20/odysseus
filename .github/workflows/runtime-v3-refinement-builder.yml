name: Runtime V3 retry refinement builder

on:
  pull_request:
    branches:
      - agent/runtime-v3-foundation
    paths:
      - scripts/runtime_v3_retry_refinement.py
      - .github/workflows/runtime-v3-refinement-builder.yml
      - tests/runtime_v3/test_ledger.py
      - tests/runtime_v3/test_effect_bridge.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-v3-refinement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refine-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply retry and approval refinement
        run: python scripts/runtime_v3_retry_refinement.py
      - name: Compile refined runtime
        run: |
          python -m compileall -q \
            src/agent/runtime_v3 \
            tests/runtime_v3
      - name: Run Runtime V3 tests
        run: python -m unittest discover -s tests/runtime_v3 -v
      - name: Validate diff
        run: git diff --check
      - name: Commit verified refinement
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add \
            src/agent/runtime_v3/ledger.py \
            src/agent/runtime_v3/effect_bridge.py \
            src/agent/runtime_v3/executor_bridge.py
          git commit -m "fix(agent): refine durable retry identities"
          git push origin HEAD:"${HEAD_REF}"
