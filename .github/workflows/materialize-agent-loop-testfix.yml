name: Materialize agent-loop test scaffold fix

on:
  push:
    branches:
      - agent/lab-agent-loop-testfix-dev

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, 'materialize agent-loop test scaffold fix') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Apply assertion-driven transform
        run: |
          python scripts/materialize_agent_loop_testfix.py
          python -m py_compile tests/test_agent_loop.py
          git diff --check
      - name: Commit transformed test only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_agent_loop.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'test(agent): materialize agent-loop test scaffold fix'
          git push origin HEAD:agent/lab-agent-loop-testfix-dev
