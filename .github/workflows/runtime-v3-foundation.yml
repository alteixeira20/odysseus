name: Runtime V3 foundation builder

on:
  pull_request:
    branches:
      - agentic-lab
    paths:
      - scripts/runtime_v3_patch_existing.py
      - scripts/runtime_v3_pretest_fix.py
      - scripts/runtime_v3_postpatch_fix.py
      - .github/workflows/runtime-v3-foundation.yml
      - src/agent/runtime_v3/**
      - tests/runtime_v3/**

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-v3-foundation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply transaction-safe migration fix
        run: python scripts/runtime_v3_pretest_fix.py

      - name: Apply deterministic integration patches
        run: python scripts/runtime_v3_patch_existing.py

      - name: Repair generated recovery expressions
        run: python scripts/runtime_v3_postpatch_fix.py

      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            src/agent/runtime_v3 \
            src/agent/api.py \
            src/agent/rounds/tool_calls.py \
            src/mcp_manager.py \
            src/builtin_mcp.py \
            tests/runtime_v3

      - name: Run Runtime V3 fault-oriented tests
        run: python -m unittest discover -s tests/runtime_v3 -v

      - name: Validate JavaScript syntax
        run: node --check static/js/chat.js

      - name: Validate diff
        run: git diff --check

      - name: Commit verified integration
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add \
            .env.example \
            requirements.txt \
            src/agent/runtime_v3/ledger.py \
            src/agent/rounds/tool_calls.py \
            src/agent_loop.py \
            src/mcp_manager.py \
            src/builtin_mcp.py \
            static/js/chat.js
          git commit -m "feat(agent): integrate Runtime V3 safety boundaries"
          git push origin HEAD:"${HEAD_REF}"
