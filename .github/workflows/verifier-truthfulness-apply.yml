name: Apply verifier truthfulness integration

on:
  pull_request:
    branches:
      - agentic-lab
    paths:
      - scripts/apply_verifier_truthfulness_patch.py
      - .github/workflows/verifier-truthfulness-apply.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: verifier-truthfulness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/verifier-truthfulness'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Apply asserted source patch
        run: |
          set -euo pipefail
          python scripts/apply_verifier_truthfulness_patch.py
          git diff --check
          git diff --exit-code -- src/agent/supervision/verifier.py tests/test_agent_verifier_truthfulness.py || true
          git diff -- src/agent_loop.py

      - name: Install locked dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify patched integration
        run: |
          set -euo pipefail
          python -m compileall -q src/agent_loop.py src/agent/supervision/verifier.py
          python -m pytest -q --tb=short \
            tests/test_agent_verifier_truthfulness.py \
            tests/test_agent_verifier_component.py \
            tests/test_agent_runtime_contract.py

      - name: Commit ordinary source integration
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "odysseus-agent-lab-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add src/agent_loop.py
          if git diff --cached --quiet; then
            echo "No source integration change to commit"
            exit 0
          fi
          git commit -m "fix(agent): enforce truthful completion verification"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:"${HEAD_REF}"
