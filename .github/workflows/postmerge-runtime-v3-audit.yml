name: Post-merge Runtime V3 audit repairs

on:
  pull_request:
    branches:
      - agentic-lab
    paths:
      - src/agent/runtime_v3/**
      - src/builtin_mcp.py
      - src/agent_runs.py
      - routes/agent_runtime_routes.py
      - setup.py
      - Dockerfile
      - package.json
      - package-lock.json
      - tests/runtime_v3/**
      - scripts/postmerge_runtime_v3_fix.py
      - scripts/postmerge_playwright_bin_fix.py
      - .github/workflows/postmerge-runtime-v3-audit.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: postmerge-runtime-v3-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact audit head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Pin browser MCP in package lock
        run: npm install --package-lock-only --ignore-scripts --save-exact @playwright/mcp@0.0.68

      - name: Align generated integration with package-declared binary
        run: python scripts/postmerge_playwright_bin_fix.py

      - name: Apply deterministic post-merge repairs
        run: python scripts/postmerge_runtime_v3_fix.py

      - name: Install and verify production Node runtime
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          test -x node_modules/.bin/playwright-mcp
          node - <<'NODE'
          const pkg = require('./node_modules/@playwright/mcp/package.json');
          if (pkg.version !== '0.0.68') throw new Error(`unexpected version ${pkg.version}`);
          const bins = typeof pkg.bin === 'string' ? { default: pkg.bin } : pkg.bin;
          if (!bins || !Object.prototype.hasOwnProperty.call(bins, 'playwright-mcp')) {
            throw new Error(`unexpected bin mapping: ${JSON.stringify(pkg.bin)}`);
          }
          NODE
          timeout 15s node_modules/.bin/playwright-mcp --help >/tmp/mcp-help.txt
          grep -qi playwright /tmp/mcp-help.txt
          npm audit --omit=dev --audit-level=high

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile changed runtime
        run: |
          python -m compileall -q \
            app.py \
            routes/agent_runtime_routes.py \
            src/agent_runs.py \
            src/agent/runtime_v3 \
            src/builtin_mcp.py \
            setup.py \
            tests/runtime_v3

      - name: Run Runtime V3 regression suite
        run: python -m unittest discover -s tests/runtime_v3 -v

      - name: Run full Python test suite
        run: timeout 25m python -m pytest -q

      - name: Validate browser-side JavaScript
        run: |
          node --check static/js/chat.js
          node --check static/js/agentRuntimeInspector.js

      - name: Validate generated diff
        run: git diff --check

      - name: Commit verified product repair and remove temporary machinery
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/postmerge-runtime-v3-audit.yml \
            .github/workflows/runtime-v3-mcp-cleanup.yml \
            .github/workflows/runtime-v3-mcp-deployment-builder.yml \
            scripts/postmerge_runtime_v3_fix.py \
            scripts/postmerge_playwright_bin_fix.py \
            scripts/runtime_v3_mcp_deployment_patch.py \
            scripts/runtime_v3_mcp_deployment_postpatch.py \
            scripts/runtime_v3_mcp_setup_anchor_fix.py
          git add \
            .env.example \
            Dockerfile \
            docs/setup.md \
            package.json \
            package-lock.json \
            routes/agent_runtime_routes.py \
            setup.py \
            src/agent_runs.py \
            src/agent/runtime_v3/config.py \
            src/agent/runtime_v3/ledger.py \
            src/agent/runtime_v3/operations.py \
            src/builtin_mcp.py \
            tests/runtime_v3/test_mcp_deployment.py \
            tests/runtime_v3/test_mcp_local_binary.py \
            tests/runtime_v3/test_postmerge_audit.py
          if git diff --cached --quiet; then
            echo "No verified changes to commit"
            exit 1
          fi
          git commit -m "fix(agent): repair merged Runtime V3 deployment and retention"
          git push origin HEAD:"${HEAD_REF}"
