# Supply-chain review
#
# The preferred gate uses GitHub's dependency graph to compare base and head.
# Some forks/repositories do not expose that API. In that case the workflow
# falls back to stricter current-state audits for every supported manifest
# instead of failing permanently or silently skipping dependency security.

name: Dependency review

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependency-review-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Detect dependency graph capability
        id: dependency_graph
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          response="${RUNNER_TEMP}/dependency-graph-response.json"
          status="$({
            curl --silent --show-error \
              --output "${response}" \
              --write-out '%{http_code}' \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPOSITORY}/dependency-graph/compare/${BASE_SHA}...${HEAD_SHA}"
          })"
          case "${status}" in
            200)
              echo 'supported=true' >> "${GITHUB_OUTPUT}"
              ;;
            403|404)
              echo 'supported=false' >> "${GITHUB_OUTPUT}"
              echo 'GitHub dependency graph is unavailable; using strict manifest audits.'
              ;;
            *)
              echo "Unexpected dependency graph API status: ${status}" >&2
              cat "${response}" >&2 || true
              exit 1
              ;;
          esac

      - name: Review dependency changes
        if: steps.dependency_graph.outputs.supported == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate

      - name: Set up Python for fallback audit
        if: steps.dependency_graph.outputs.supported == 'false'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Run strict fallback manifest audits
        if: steps.dependency_graph.outputs.supported == 'false'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.10.0
          pip-audit -r requirements.txt -r requirements-optional.txt --strict
          if [[ -f package-lock.json ]]; then
            npm audit --package-lock-only --omit=dev --audit-level=moderate
          fi

  pip-audit:
    name: pip-audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.12'

      - name: Run pip-audit on requirements
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pip-audit==2.10.0
          pip-audit -r requirements.txt -r requirements-optional.txt --strict
