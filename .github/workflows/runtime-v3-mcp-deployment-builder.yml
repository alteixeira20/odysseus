name: Runtime V3 MCP deployment builder

on:
  pull_request:
    branches:
      - agent/runtime-v3-workspace-journal
    paths:
      - scripts/runtime_v3_mcp_deployment_patch.py
      - scripts/runtime_v3_mcp_deployment_postpatch.py
      - .github/workflows/runtime-v3-mcp-deployment-builder.yml
      - tests/runtime_v3/test_mcp_deployment.py

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-v3-mcp-deployment-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  integrate-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Verify exact upstream package exists
        run: |
          set -euo pipefail
          test "$(npm view @playwright/mcp@0.0.68 version)" = "0.0.68"
          npm view @playwright/mcp@0.0.68 dist.integrity
          npm view @playwright/mcp@0.0.68 bin --json

      - name: Pin package in project lockfile
        run: npm install --package-lock-only --ignore-scripts --save-exact @playwright/mcp@0.0.68

      - name: Apply deterministic MCP deployment integration
        run: python scripts/runtime_v3_mcp_deployment_patch.py

      - name: Apply cross-platform executable corrections
        run: python scripts/runtime_v3_mcp_deployment_postpatch.py

      - name: Install production Node runtime from lockfile
        run: npm ci --omit=dev --ignore-scripts

      - name: Verify installed package identity and executable
        run: |
          set -euo pipefail
          node - <<'NODE'
          const pkg = require('./node_modules/@playwright/mcp/package.json');
          if (pkg.version !== '0.0.68') throw new Error(`unexpected version ${pkg.version}`);
          const bins = typeof pkg.bin === 'string' ? { default: pkg.bin } : pkg.bin;
          if (!bins || !Object.prototype.hasOwnProperty.call(bins, 'mcp-server-playwright')) {
            throw new Error(`unexpected package bins: ${JSON.stringify(pkg.bin)}`);
          }
          NODE
          test -x node_modules/.bin/mcp-server-playwright
          timeout 15s node_modules/.bin/mcp-server-playwright --help >/tmp/playwright-mcp-help.txt
          grep -qi 'playwright' /tmp/playwright-mcp-help.txt

      - name: Audit production Node dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Compile changed Python modules
        run: |
          python -m compileall -q \
            src/builtin_mcp.py \
            src/mcp_manager.py \
            setup.py \
            tests/runtime_v3

      - name: Run complete Runtime V3 suite
        run: python -m unittest discover -s tests/runtime_v3 -v

      - name: Validate diff
        run: git diff --check

      - name: Commit verified deployment integration
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add \
            package.json \
            package-lock.json \
            src/builtin_mcp.py \
            src/mcp_manager.py \
            setup.py \
            Dockerfile \
            docs/setup.md \
            .env.example
          git commit -m "feat(agent): install pinned browser MCP at build time"
          git push origin HEAD:"${HEAD_REF}"
