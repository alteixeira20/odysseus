name: Agent integrations audit fixup

on:
  push:
    branches:
      - feat/agent-integrations-hub

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/agent-integrations-hub
          fetch-depth: 0

      - name: Apply audited fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) AGY bundle layout: the UI extracts directly into ~/.gemini/skills/.
          # Archive members therefore need to start at odysseus/, not skills/odysseus/.
          path = Path('routes/codex_routes.py')
          text = path.read_text()
          marker = 'def setup_agy_routes() -> APIRouter:'
          start = text.index(marker)
          head, tail = text[:start], text[start:]
          old_comment = '''        # Only ship the skills/ subtree so extracting at ~/.gemini/\n        # puts skills/odysseus/ in place.\n'''
          new_comment = '''        # Root the archive at odysseus/ so extracting directly into\n        # ~/.gemini/skills/ creates ~/.gemini/skills/odysseus/.\n'''
          if old_comment not in tail:
              raise SystemExit('AGY bundle comment anchor not found')
          tail = tail.replace(old_comment, new_comment, 1)
          if tail.count('bundle_root = skills_root.parent') != 1:
              raise SystemExit('unexpected AGY bundle_root anchor count')
          tail = tail.replace('bundle_root = skills_root.parent', 'bundle_root = skills_root', 1)
          path.write_text(head + tail)

          # 2) api_tokens.agent_provider must upgrade existing PostgreSQL as well as
          # SQLite databases and should persist identities of clearly named legacy
          # Codex/Claude/AGY connections before users rename them.
          path = Path('core/database.py')
          text = path.read_text()
          start = text.index('def _migrate_api_tokens_agent_provider():')
          end = text.index('\ndef ', start + len('def _migrate_api_tokens_agent_provider():'))
          replacement = '''def _migrate_api_tokens_agent_provider():
              """Add/backfill ``api_tokens.agent_provider`` on supported databases.

              ``create_all()`` covers fresh installs but does not add columns to an
              existing table.  Use SQLAlchemy inspection/DDL instead of SQLite-only
              PRAGMA calls so PostgreSQL upgrades receive the column too.  Known
              legacy CLI-agent names are backfilled once so future renames do not
              erase provider identity.
              """
              try:
                  with engine.begin() as conn:
                      inspector = inspect(conn)
                      if not inspector.has_table("api_tokens"):
                          return
                      columns = {col["name"] for col in inspector.get_columns("api_tokens")}
                      if "agent_provider" not in columns:
                          conn.execute(text("ALTER TABLE api_tokens ADD COLUMN agent_provider VARCHAR"))
                          logging.getLogger(__name__).info("Migrated: added agent_provider column to api_tokens")

                      conn.execute(text("""
                          UPDATE api_tokens
                          SET agent_provider = CASE
                              WHEN lower(trim(name)) = 'agy'
                                   OR lower(trim(name)) LIKE 'agy agent%' THEN 'agy'
                              WHEN lower(trim(name)) = 'claude'
                                   OR lower(trim(name)) LIKE 'claude agent%' THEN 'claude'
                              WHEN lower(trim(name)) = 'codex'
                                   OR lower(trim(name)) LIKE 'codex agent%' THEN 'codex'
                              ELSE agent_provider
                          END
                          WHERE agent_provider IS NULL
                      """))
              except Exception as e:
                  logging.getLogger(__name__).warning(
                      "api_tokens.agent_provider migration failed: %s", e
                  )

          '''
          path.write_text(text[:start] + replacement + text[end + 1:])

          # 3) Integration UI: global Add belongs to Overview only and must hide
          # whenever an inline form is visible.  The prior truthiness check treated
          # style.display == '' as closed even though that is the visible state.
          path = Path('static/js/settings.js')
          text = path.read_text()
          old = "  let integrationNotice = '';\n\n  if (catTabsEl) {"
          new = "  let integrationNotice = '';\n  let _syncAddBtnWrap = () => {};\n\n  if (catTabsEl) {"
          if old not in text:
              raise SystemExit('integrationNotice anchor not found')
          text = text.replace(old, new, 1)

          old = """        if (formEl) formEl.style.display = 'none';
                  renderList();
                });"""
          new = """        if (formEl) formEl.style.display = 'none';
                  renderList();
                  _syncAddBtnWrap();
                });"""
          if old not in text:
              raise SystemExit('category click anchor not found')
          text = text.replace(old, new, 1)

          old = """    const addBtnWrap = addBtn.parentElement;
              const _syncAddBtnWrap = () => {
                const formOpen = formEl.style.display && formEl.style.display !== 'none';
                addBtnWrap.style.display = formOpen ? 'none' : '';
              };"""
          new = """    const addBtnWrap = addBtn.parentElement;
              _syncAddBtnWrap = () => {
                const formOpen = formEl.style.display !== 'none' && formEl.children.length > 0;
                addBtnWrap.style.display = (_currentCategory === 'overview' && !formOpen) ? '' : 'none';
              };"""
          if old not in text:
              raise SystemExit('add button observer anchor not found')
          text = text.replace(old, new, 1)

          if 'All Connected Services (${items.length})' not in text:
              raise SystemExit('overview label anchor not found')
          text = text.replace('All Connected Services (${items.length})', 'All Integrations (${items.length})', 1)
          path.write_text(text)

          # 4) Behavioral regression for the AGY archive layout.
          Path('tests/test_agy_plugin_bundle.py').write_text(r'''"""AGY integration bundle layout regression coverage."""

import io
import zipfile
from types import SimpleNamespace

import pytest


@pytest.mark.asyncio
async def test_agy_bundle_extracts_directly_into_gemini_skills(monkeypatch):
    import routes.codex_routes as mod

    monkeypatch.setattr(mod, "require_authenticated_request", lambda request: None)
    router = mod.setup_agy_routes()
    endpoint = next(
        route.endpoint
        for route in router.routes
        if getattr(route, "path", "") == "/api/agy/plugin.zip"
    )

    response = endpoint(SimpleNamespace())
    payload = b"".join([chunk async for chunk in response.body_iterator])
    with zipfile.ZipFile(io.BytesIO(payload)) as zf:
        names = set(zf.namelist())

    assert "odysseus/SKILL.md" in names
    assert "odysseus/scripts/odysseus_api.py" in names
    assert not any(name.startswith("skills/") for name in names)
''')

          # 5) Migration behavior regression (fresh test DB with legacy rows).
          Path('tests/test_agent_provider_migration.py').write_text(r'''"""Regression tests for the explicit CLI-agent provider migration."""

from sqlalchemy import create_engine, inspect, text


def test_agent_provider_migration_adds_column_and_backfills_legacy_names(monkeypatch):
    import core.database as dbmod

    engine = create_engine("sqlite:///:memory:")
    with engine.begin() as conn:
        conn.execute(text("""
            CREATE TABLE api_tokens (
                id VARCHAR PRIMARY KEY,
                name VARCHAR NOT NULL
            )
        """))
        conn.execute(
            text("INSERT INTO api_tokens (id, name) VALUES (:id, :name)"),
            [
                {"id": "c1", "name": "Codex Agent Main"},
                {"id": "a1", "name": "AGY Agent Workstation"},
                {"id": "h1", "name": "Claude Agent Laptop"},
                {"id": "x1", "name": "Generic API Token"},
            ],
        )

    monkeypatch.setattr(dbmod, "engine", engine)
    dbmod._migrate_api_tokens_agent_provider()

    columns = {c["name"] for c in inspect(engine).get_columns("api_tokens")}
    assert "agent_provider" in columns
    with engine.connect() as conn:
        rows = dict(conn.execute(text("SELECT id, agent_provider FROM api_tokens")).all())
    assert rows == {"c1": "codex", "a1": "agy", "h1": "claude", "x1": None}

    # Idempotent on a second startup.
    dbmod._migrate_api_tokens_agent_provider()
''')
          PY

      - name: Validate edited source
        shell: bash
        run: |
          python3 -m py_compile core/database.py routes/api_token_routes.py routes/codex_routes.py
          node --check static/js/settings.js
          git diff --check

      - name: Commit audited fixes and remove transient workflow
        shell: bash
        run: |
          git config user.name "alteixeira20"
          git config user.email "alteixeira20@users.noreply.github.com"
          git rm .github/workflows/agent-integrations-fixup.yml
          git add core/database.py routes/codex_routes.py static/js/settings.js tests/test_agy_plugin_bundle.py tests/test_agent_provider_migration.py
          git commit -m "fix(integrations): address agent hub audit findings"
          git push origin HEAD:feat/agent-integrations-hub
