name: Remove obsolete Runtime V3 MCP builders

on:
  pull_request:
    branches:
      - agentic-lab
    paths:
      - .github/workflows/runtime-v3-mcp-cleanup.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: runtime-v3-mcp-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Remove exact obsolete builder paths
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "odysseus-runtime-v3-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git rm --ignore-unmatch \
            .github/workflows/runtime-v3-mcp-deployment-builder.yml \
            .github/workflows/runtime-v3-mcp-cleanup.yml \
            scripts/runtime_v3_mcp_deployment_patch.py \
            scripts/runtime_v3_mcp_deployment_postpatch.py \
            scripts/runtime_v3_mcp_setup_anchor_fix.py
          if git diff --cached --quiet; then
            echo "No obsolete builder paths remain"
            exit 0
          fi
          git commit -m "chore(agent): remove obsolete MCP deployment builders"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" \
            push origin HEAD:"${HEAD_REF}"
