name: Apply verifier force-answer audit fix

on:
  pull_request:
    branches:
      - agentic-lab
    paths:
      - scripts/apply_verifier_force_answer_patch.py
      - .github/workflows/verifier-force-answer-apply.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/verifier-truthfulness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Apply asserted audit fix
        run: |
          set -euo pipefail
          python scripts/apply_verifier_force_answer_patch.py
          git diff --check
          python -m compileall -q src/agent_loop.py
      - name: Commit ordinary source fix
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "odysseus-agent-lab-bot"
          git config user.email "111787685+alteixeira20@users.noreply.github.com"
          git add src/agent_loop.py
          git commit -m "fix(agent): verify force-answer completion"
          auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="$auth_header" push origin HEAD:"${HEAD_REF}"
